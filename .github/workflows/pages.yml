name: Pages

# Publishes the site. The repository's Pages source is "GitHub Actions", so
# without this file a push runs the tests and deploys nothing — which is
# exactly what happened for three pushes in a row, silently. Every push to
# main ships; "Run workflow" ships by hand.
#
# One deploy at a time, queued rather than cancelled: two pushes landing
# close together is what left a deployment stuck "in progress" on GitHub's
# side for half an hour, with every later one refused behind it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # The site is the repository: index.html at the root, assets/ and
      # vendor/ beside it. Nothing is built.
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
